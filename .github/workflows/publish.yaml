name: Publish docs

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.x'
          cache: pip

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install TeX Live (fuer PDF)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            texlive-xetex texlive-fonts-recommended \
            texlive-latex-recommended texlive-lang-german \
            latexmk

      - name: Build HTML
        run: make html

      - name: Build PDF
        run: make pdf

      - name: Upload PDF as artifact
        uses: actions/upload-artifact@v7
        with:
          name: BEG-BHZ-Satzung-pdf
          path: _build/latex/*.pdf

      - name: Deploy HTML to gh-pages
        if: github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v4
        with:
          publish_branch: gh-pages
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: _build/html
          force_orphan: true

      - name: PDF als Release-Asset (Tag-Push)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: _build/latex/*.pdf
